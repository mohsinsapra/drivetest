name: Flutter CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_android:
    runs-on: ubuntu-latest
    # Only run when commit message contains [deploy]
    if: contains(github.event.head_commit.message, '[deploy]') || github.event_name == 'pull_request'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Decode Keystore
        run: |
          echo "${{ vars.KEYSTORE_BASE64 }}" | base64 --decode > android/app/taxiappkey.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ vars.KEY_STORE_PASSWORD }}
          keyPassword=${{ vars.KEY_PASSWORD }}
          keyAlias=${{ vars.KEY_ALIAS }}
          storeFile=app/taxiappkey.jks
          EOF

      - name: Decode Play Store JSON Key
        run: |
          echo "${{ vars.PLAY_STORE_JSON_KEY_BASE64 }}" | base64 --decode > android/fastlane/play-store-key.json

      # On PRs: build only — no Play Store upload
      - name: Build APK (PR check)
        if: github.event_name == 'pull_request'
        run: |
          flutter build apk --release \
            --dart-define=FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }} \
            --dart-define=FIREBASE_AUTH_DOMAIN=${{ vars.FIREBASE_AUTH_DOMAIN }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STORAGE_BUCKET }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ vars.FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID }} \
            --dart-define=FIREBASE_MEASUREMENT_ID=${{ vars.FIREBASE_MEASUREMENT_ID }} \
            --dart-define=STRIPE_PUBLISHABLE_KEY=${{ vars.STRIPE_PUBLISHABLE_KEY }} \
            --dart-define=ENCRYPTION_PASSPHRASE=${{ vars.ENCRYPTION_PASSPHRASE }}

      - name: Upload APK (PR check)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      # On push to main: Fastlane beta lane → builds AAB + uploads to Play Store alpha
      - name: Deploy to Play Store via Fastlane
        if: github.event_name == 'push'
        working-directory: android
        env:
          PLAY_STORE_JSON_KEY_PATH: fastlane/play-store-key.json
          FLUTTER_DART_DEFINES: >-
            --dart-define=FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }}
            --dart-define=FIREBASE_AUTH_DOMAIN=${{ vars.FIREBASE_AUTH_DOMAIN }}
            --dart-define=FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}
            --dart-define=FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STORAGE_BUCKET }}
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
            --dart-define=FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID }}
            --dart-define=FIREBASE_MEASUREMENT_ID=${{ vars.FIREBASE_MEASUREMENT_ID }}
            --dart-define=STRIPE_PUBLISHABLE_KEY=${{ vars.STRIPE_PUBLISHABLE_KEY }}
            --dart-define=ENCRYPTION_PASSPHRASE=${{ vars.ENCRYPTION_PASSPHRASE }}
        run: bundle exec fastlane beta
