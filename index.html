<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="License exam preparation app for taxi drivers, offering practice tests, study materials, and progress tracking to help users pass their taxi license exams with confidence.">
  <meta name="google-signin-client_id" content="678561448025-n2jia0bm2q47ojt4dmba4o7bg2opu18t.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Drive Test">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Drive Test</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = "2286384867" /* Flutter's service worker is deprecated and will be removed in a future Flutter release. */;
  </script>
  <!-- Lottie web player — used on web to bypass Flutter engine path-rendering bug -->
  <script src="https://unpkg.com/@lottiefiles/lottie-player@2.0.2/dist/lottie-player.js"></script>

  <!-- Stripe.js — required by flutter_stripe_web -->
  <script src="https://js.stripe.com/v3/" defer></script>

  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine({renderer: "html"}).then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>

  <!-- Firebase is initialised by Flutter's firebase_core plugin in main.dart.
       Do NOT add a second initializeApp() call here — it creates a duplicate-app
       conflict that breaks getToken() and kills FCM on web. -->
</body>
</html>
